{{- /* Signs sign-in tokens and service-to-service calls. Generated once, then kept across upgrades. */}}
{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secret" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubebank.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  bank-secret: {{ index $existing.data "bank-secret" }}
  {{- else }}
  bank-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}

{{- end }}
