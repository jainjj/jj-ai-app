{{- if .Values.neuvector.enabled }}
{{- $svc := printf "%s.%s" .Release.Name .Release.Namespace }}
{{- /* Ollama's NeuVector group comes from its URL: http://<service>.<namespace>.svc... */}}
{{- $ollama := (urlParse .Values.ollama.url).host | splitList ":" | first | splitList "." }}
{{- $ollamaSvc := printf "%s.%s" (index $ollama 0) (index $ollama 1) }}
# DLP blocks credit card numbers sent to (or from) the pod. DLP only *blocks* in
# Protect mode; Monitor just raises a security event. Protect also blocks any
# connection not listed below.
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: nv.{{ $svc }}
  labels: {{- include "jj-ai.labels" . | nindent 4 }}
spec:
  target:
    policymode: {{ .Values.neuvector.policyMode }}
    selector:
      name: nv.{{ $svc }}
      criteria:
        - { key: service, op: "=", value: {{ $svc }} }
        - { key: domain, op: "=", value: {{ .Release.Namespace }} }
  dlp:
    status: true
    settings:
      - name: sensor.creditcard
        action: deny
  ingress:
    - name: {{ .Release.Name }}-from-ingress
      action: allow
      ports: tcp/8080
      selector:
        name: nv.{{ .Values.neuvector.ingressController }}
        criteria:
          - { key: service, op: "=", value: {{ .Values.neuvector.ingressController }} }
          - { key: domain, op: "=", value: {{ .Values.neuvector.ingressController | splitList "." | last }} }
    # kubelet readiness/liveness probes.
    - name: {{ .Release.Name }}-from-nodes
      action: allow
      ports: tcp/8080
      selector:
        name: nodes
  egress:
    - name: {{ .Release.Name }}-to-ollama
      action: allow
      ports: tcp/{{ (urlParse .Values.ollama.url).host | splitList ":" | last }}
      selector:
        name: nv.{{ $ollamaSvc }}
        criteria:
          - { key: service, op: "=", value: {{ $ollamaSvc }} }
          - { key: domain, op: "=", value: {{ index $ollama 1 }} }
    - name: {{ .Release.Name }}-to-dns
      action: allow
      ports: tcp/53,udp/53
      selector:
        name: nv.{{ .Values.neuvector.dns }}
        criteria:
          - { key: service, op: "=", value: {{ .Values.neuvector.dns }} }
          - { key: domain, op: "=", value: {{ .Values.neuvector.dns | splitList "." | last }} }
    # Kubernetes API, for the cluster snapshot.
    - name: {{ .Release.Name }}-to-apiserver
      action: allow
      ports: tcp/443,tcp/6443
      selector:
        name: nodes
  process_profile:
    baseline: zero-drift
  process:
    - { name: python3, path: /usr/bin/python3.13, action: allow }
    - { name: python3.13, path: /usr/bin/python3.13, action: allow }
{{- end }}
