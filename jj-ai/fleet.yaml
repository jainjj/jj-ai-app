# Fleet bundle for jj-ai. Which clusters get it is decided by the GitRepo's targets
# (see rancher/gitrepo.yaml); the per-cluster settings come from cluster labels.
defaultNamespace: jj-ai

helm:
  releaseName: jj-ai
  # Adopt resources from an earlier `kubectl apply` install instead of failing on them.
  takeOwnership: true
  values:
    ingress:
      # e.g. label the cluster  jj-ai/host=jj-ai.34.244.248.6.sslip.io
      host: '${ get .ClusterLabels "jj-ai/host" }'
